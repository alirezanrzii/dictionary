{% load static %}
<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="{% static 'css/boote_dada.css' %}" rel="stylesheet">

{% block extra_head %}

{% endblock %}
</head>



<body style="background-color: #ebeff1;">
<div style="background-color: #ef78;width: 100%;height: 100px; text-align:center; font-size: 40px; font-weight: bolder; padding: 30px;">
    <p>هدر</p>
</div>


{% block content %}

{% endblock %}




<div>
    <p style="background-color: #e685b5;width: 100%;height: 100px; text-align:center; font-size: 40px; font-weight: bolder; padding: 30px;">فوتر</p>
</div>
<script src="{% static 'js/boote_dada.js' %}"></script>
<script>
    const myModal = new bootstrap.Modal('#meaningModal', {
        keyboard: false
    })

    function showMeaning(id) {
        myModal.show()
        let modal_body = document.getElementById('modal_body')
        modal_body.innerHTML = ''
        {% for word in words %}
            if (id === {{ word.id }}) {
                {% for m in word.meaning.all %}
                    modal_body.innerHTML += `{{ m }}` + '</br>'
                {% endfor %}
            }
        {% endfor %}
    }
</script>
{% block extra_js %}

{% endblock %}

</body>
</html>
